<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: the page runs under the iPhone notch / home bar; style.css keeps content clear with safe-area insets -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Life Tracker</title>
  <!-- Installable app (PWA): name, icons, colours. Opened from the home screen it runs full screen. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Life Tracker">
  <!-- black-translucent: the status bar (time, battery) floats over our dark background -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <!-- Inter font from Google Fonts (falls back to Segoe UI if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Cloud settings first: hides the app before it draws when nobody is logged in on this device -->
  <script src="cloud-config.js"></script>
</head>
<body>
  <!-- Backdrop behind everything: dark gradient + slow-drifting colour blobs that the glass panels blur -->
  <div class="backdrop" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <!-- Side tabs (navigation): each slides out on hover; clicking switches section without reloading -->
  <nav class="side-tabs" aria-label="Sections">
    <a href="#pnl" class="tab" data-tab="pnl">
      <span class="tab-label">PnL</span>
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="13" width="3.5" height="7" rx="1"/>
        <rect x="10.25" y="8" width="3.5" height="12" rx="1"/>
        <rect x="16.5" y="4" width="3.5" height="16" rx="1"/>
      </svg>
    </a>
    <a href="#life" class="tab" data-tab="life">
      <span class="tab-label">Life</span>
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/>
      </svg>
    </a>
    <a href="#journal" class="tab" data-tab="journal">
      <span class="tab-label">Journal</span>
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 3.5h10a1.5 1.5 0 0 1 1.5 1.5v15.2a.6.6 0 0 1-.95.49L12 16.9l-5.55 3.79a.6.6 0 0 1-.95-.49V5A1.5 1.5 0 0 1 7 3.5z"/>
      </svg>
    </a>
    <a href="#looksmax" class="tab" data-tab="looksmax">
      <span class="tab-label">Looksmax</span>
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10.5 3.5l1.9 5.1 5.1 1.9-5.1 1.9-1.9 5.1-1.9-5.1-5.1-1.9 5.1-1.9z"/>
        <path d="M18 14l.95 2.55L21.5 17.5l-2.55.95L18 21l-.95-2.55-2.55-.95 2.55-.95z"/>
      </svg>
    </a>
  </nav>

  <!-- One section per tab; only the active one is shown -->
  <main>
    <section class="page" id="page-pnl">
      <header class="page-header">
        <h1>PnL</h1>
      </header>
      <!-- Filled in by pnl.js: sub-tabs (Dashboard, Products, On the way, ...) and their content -->
      <div id="pnl-root"></div>
    </section>

    <section class="page" id="page-life">
      <header class="page-header">
        <h1>Life</h1>
      </header>
      <!-- Filled in by life.js: sub-tabs (Today, Habits, Plans, ...) and their content -->
      <div id="life-root"></div>
    </section>

    <section class="page" id="page-journal">
      <header class="page-header">
        <h1>Journal</h1>
      </header>
      <!-- Filled in by journal.js: song of the week, then the saved feed -->
      <div id="journal-root"></div>
    </section>

    <section class="page" id="page-looksmax">
      <header class="page-header">
        <h1>Looksmax</h1>
      </header>
      <!-- Filled in by looks.js: one card per thing I'm working on -->
      <div id="looksmax-root"></div>
    </section>
  </main>

  <!-- Global music player (player.js): created once, never rebuilt, so songs keep playing on every tab.
       player-host holds the <audio> and the sites' hidden players (off-screen, see-through, never display:none). -->
  <div class="player-host" id="player-host" aria-hidden="true"></div>
  <!-- Mini-player: docked above the bottom bar while a song plays and you're on another tab -->
  <div class="jr-mini" id="jr-mini" hidden></div>

  <!-- Modal: hidden until opened. Closes via X button, Escape, or clicking the dimmed backdrop. -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">Add</h2>
        <button class="modal-close" data-close-modal aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="script.js"></script>
  <!-- Glass select / date / time pickers: replace every native one, site-wide -->
  <script src="pickers.js"></script>
  <!-- PnL: calculations first, then storage, then the screens that use both -->
  <script src="pnl-calc.js"></script>
  <script src="pnl-store.js"></script>
  <script src="pnl.js"></script>
  <!-- Life: same pattern (calculations, storage + combined backup, screens) -->
  <script src="life-calc.js"></script>
  <script src="life-store.js"></script>
  <!-- Looksmax calculations + storage come before life.js: Life shows today's items and counts them in the day score -->
  <script src="looks-calc.js"></script>
  <script src="looks-store.js"></script>
  <script src="life.js"></script>
  <!-- Journal: same pattern (photos / audio in IndexedDB, see journal-store.js) -->
  <!-- Global music player (song of the week) -->
  <script src="player.js"></script>
  <script src="journal-calc.js"></script>
  <script src="journal-store.js"></script>
  <script src="journal.js"></script>
  <!-- Looksmax screens (after Journal: progress photos use its Media store) -->
  <script src="looks.js"></script>
  <!-- Accounts + cloud sync: Supabase's JS library (exact version, from a CDN), then our sync code -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js"></script>
  <script src="cloud.js"></script>
</body>
</html>
